name: Validate and deploy Scouty pitch deck
on:
  push:
    branches: [main]
    paths: ['scouty-pitch-deck.html', 'assets/**', 'scripts/**', '.github/workflows/deploy-scouty-pitch-deck.yml']
  pull_request:
    branches: [main]
    paths: ['scouty-pitch-deck.html', 'assets/**', 'scripts/**', '.github/workflows/deploy-scouty-pitch-deck.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scouty-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate presentation
        run: python3 scripts/check-deck.py
      - name: Package static site
        run: python3 scripts/build-site.py
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: scouty-pitch-deck
          path: site/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
